name: Build and Release LoginDeck

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: Version increment
        required: true
        type: choice
        options: [major, minor, patch]
        default: patch
      release_notes:
        description: Release notes (optional)
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Calculate next version
        if: github.event_name == 'workflow_dispatch'
        id: version
        shell: pwsh
        run: |
          git fetch --tags
          $latest = git tag --list 'v*' --sort=-v:refname | Select-Object -First 1
          if (-not $latest) { $package = Get-Content package.json | ConvertFrom-Json; $latest = "v$($package.version)" }
          if ($latest -notmatch '^v?(\d+)\.(\d+)\.(\d+)$') { throw "Invalid semver tag: $latest" }
          $major = [int]$Matches[1]; $minor = [int]$Matches[2]; $patch = [int]$Matches[3]
          switch ("${{ inputs.release_type }}") {
            'major' { $major++; $minor = 0; $patch = 0 }
            'minor' { $minor++; $patch = 0 }
            'patch' { $patch++ }
            default { throw 'Unknown release type.' }
          }
          $version = "$major.$minor.$patch"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Set release version
        if: github.event_name == 'workflow_dispatch'
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist
      - name: Upload installer artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: LoginDeck-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Commit version and create tag
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json
          git commit -m "chore: release ${{ steps.version.outputs.tag }}"
          git tag '${{ steps.version.outputs.tag }}'
          git push origin HEAD:main
          git push origin '${{ steps.version.outputs.tag }}'
      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LoginDeck ${{ steps.version.outputs.tag }}
          body: ${{ inputs.release_notes }}
          generate_release_notes: ${{ inputs.release_notes == '' }}
          files: release/*
